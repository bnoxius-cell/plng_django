  <!DOCTYPE html>
  <html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Enter Room - Chat Application</title>
      <script src="https://cdn.tailwindcss.com"></script>
      <style>
          @keyframes float {
              0%, 100% { transform: translateY(0px); }
              50% { transform: translateY(-10px); }
          }
          .float-animation {
              animation: float 3s ease-in-out infinite;
          }
          .float-animation-delayed {
              animation: float 4s ease-in-out infinite;
              animation-delay: 1s;
          }
      </style>
  </head>
  <body>
      <div class="min-h-screen bg-gradient-to-br from-purple-50 via-pink-50 to-blue-50 flex items-center justify-center p-4 relative overflow-hidden">
          
          <!-- Decorative floating chat bubbles -->
          <div class="absolute top-20 left-10 w-16 h-16 bg-purple-200/30 rounded-full float-animation"></div>
          <div class="absolute top-40 right-20 w-12 h-12 bg-pink-200/30 rounded-full float-animation-delayed"></div>
          <div class="absolute bottom-32 left-1/4 w-8 h-8 bg-blue-200/30 rounded-full float-animation"></div>
          <div class="absolute bottom-20 right-1/3 w-20 h-20 bg-indigo-200/30 rounded-full float-animation-delayed"></div>
          
          <!-- Decorative speech bubbles (SVG icons) -->
          <div class="absolute top-1/4 right-10 opacity-20">
              <svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-purple-400">
                  <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
              </svg>
          </div>
          <div class="absolute bottom-1/4 left-16 opacity-20">
              <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-pink-400">
                  <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
              </svg>
          </div>
  
          <!-- Main Card -->
          <div class="bg-white rounded-3xl shadow-2xl p-8 md:p-12 max-w-md w-full relative z-10">
              
              <!-- Header -->
              <div class="text-center mb-8">
                  <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-purple-500 to-pink-500 rounded-2xl mb-4 shadow-lg">
                      <!-- Users Icon SVG -->
                      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white">
                          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                          <circle cx="9" cy="7" r="4"></circle>
                          <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
                          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                      </svg>
                  </div>
                  <h1 class="text-4xl font-bold text-gray-800 mb-2 flex items-center justify-center gap-2">
                      Enter Room
                      <!-- Sparkles Icon SVG -->
                      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-yellow-400">
                          <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path>
                          <path d="M5 3v4"></path>
                          <path d="M19 17v4"></path>
                          <path d="M3 5h4"></path>
                          <path d="M17 19h4"></path>
                      </svg>
                  </h1>
                  <p class="text-gray-500">Join the conversation and connect with others</p>
              </div>
  
              <!-- Django Form -->
              <form method="POST" class="space-y-6">
                  {% csrf_token %}
                  
                  <!-- Username Field -->
                  <div>
                      <label for="username" class="block text-gray-700 font-medium mb-2">
                          Username
                      </label>
                      <div class="relative">
                          <input
                              type="text"
                              id="username"
                              name="username"
                              required
                              class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-purple-400 focus:outline-none transition-colors bg-gray-50 focus:bg-white"
                              placeholder="Enter your username"
                          />
                      </div>
                  </div>
  
                  <!-- Room Name Field -->
                  <div>
                      <label for="room" class="block text-gray-700 font-medium mb-2">
                          Room name
                      </label>
                      <div class="relative">
                          <input
                              type="text"
                              id="room"
                              name="room"
                              required
                              class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-pink-400 focus:outline-none transition-colors bg-gray-50 focus:bg-white"
                              placeholder="Enter room name"
                          />
                      </div>
                  </div>
  
                  <!-- Submit Button -->
                  <button
                      type="submit"
                      class="w-full bg-gradient-to-r from-purple-500 to-pink-500 text-white font-semibold py-3 px-6 rounded-xl hover:shadow-lg hover:scale-105 transition-all duration-200 flex items-center justify-center gap-2 group"
                  >
                      Enter
                      <!-- MessageCircle Icon SVG -->
                      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="group-hover:rotate-12 transition-transform">
                          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                      </svg>
                  </button>
              </form>
  
              <!-- Decorative dots -->
              <div class="flex justify-center gap-2 mt-6">
                  <div class="w-2 h-2 bg-purple-300 rounded-full"></div>
                  <div class="w-2 h-2 bg-pink-300 rounded-full"></div>
                  <div class="w-2 h-2 bg-blue-300 rounded-full"></div>
              </div>
          </div>
      </div>
  </body>
  </html>
